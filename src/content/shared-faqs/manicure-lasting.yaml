question: How long does a manicure or pedicure last?
status: published
summary: Wear depends on the polish, application, nail growth, and daily activity. Regular polish may chip within about a week; gel manicures often last around two to three weeks. Pedicure polish can last longer because toenails grow more slowly and usually get less daily wear. Follow your nail tech’s care and removal advice.
fullAnswer: |-
  How long a manicure or pedicure lasts depends on the polish, how it was applied, your nail growth, and how much wear your hands or feet get. Regular nail polish may chip within about a week, while a gel manicure often lasts around two to three weeks. These are rough guides, not guarantees: your own results may be different.

  Pedicure polish can last longer than polish on fingernails because toenails generally grow more slowly and aren't exposed to the same everyday tasks. Even when the color still looks good, regrowth or lifting may be a reason to refresh it.

  To help your manicure last, wear gloves for wet cleaning jobs and avoid using your nails as tools. Follow your nail technician's advice for care and removal, especially for gel. Don't peel or pick off a coating, as this can damage the nail surface. If a nail becomes painful or the surrounding skin looks irritated, seek advice from a qualified health professional.
metaDescription: Learn how long regular polish and gel manicures may last, why pedicures can wear longer, and how to care for your nails.
