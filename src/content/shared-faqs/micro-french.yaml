question: What is a micro French manicure?
status: published
summary: A micro French is a French manicure with a much thinner tip line than the classic version. It looks subtle and modern, and works well on short nails with nude, milky, or deeper shades like burgundy.
fullAnswer: |-
  A micro French manicure is a take on the classic French manicure with an especially thin line of color at the tip of each nail. The fine tip gives the design a subtle look while keeping the contrast between the base and the edge.

  A sheer pink or nude base with a white line is a familiar choice, but the tip doesn't have to be white. Try burgundy, black, or another color you like; a milky or deeper base can change the mood too. Choose a glossy or sheer finish if you want to keep the look understated.

  Micro French tips can work on short nails as well as longer shapes. The exact line will depend on your nail length and the look you prefer, so bring a reference photo to your nail technician and ask for a fine tip rather than a wider classic French edge. You can also ask them to adjust the curve to suit your nail shape.
metaDescription: Discover what makes a micro French manicure different, plus ideas for thin tips, base colors, and short nails.
