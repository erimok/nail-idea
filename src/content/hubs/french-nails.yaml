title: French nails
area: manicure
urlSlug: french-nails
updated_at: 2026-10-25T12:58:00.000Z
intro: Explore French nails across shapes, lengths, and finishes, from narrow micro French edges to high-contrast tips. Use the gallery to compare line width, base color, and decorative details before choosing a reference. Save the details that matter and discuss the rest with your nail professional.
metaDescription: Browse 56 French manicure ideas, from fine micro French lines to colorful tips across nail shapes and lengths.
sections:
  - heading: Choose the French line and base
    body: >-
      A French manicure is defined by the contrast between a base color and a
      shaped tip, but that line does not need to be a bright white arc. Begin
      by deciding how visible you want the contrast to be. A fine micro French
      line leaves more of the base visible; a wider smile line makes the tip a
      stronger feature. On a reference image, notice where the curve begins at
      each side, how deeply it dips at the center, and whether the edge follows
      the natural free edge or creates a straighter graphic shape. These
      details give a nail professional clearer direction than saying only
      “classic French.” The base changes the mood too: sheer pink, milky white,
      nude, and saturated colors all frame the same tip differently. Compare
      the gallery images for that relationship rather than choosing a shade
      from its name alone, since lighting and screens can shift how a color
      appears.
  - heading: Match the outline to the nail shape
    body: >-
      The outline can echo the nail shape or deliberately contrast with it.
      Rounded and oval nails often pair naturally with a curved smile line,
      while a square or squoval edge can carry a flatter, more graphic tip.
      Almond and coffin shapes leave room for diagonal, V-shaped, or layered
      outlines; those designs can make the tip look longer or more intricate
      without changing the base color. Length also affects how much space is
      available. On short nails, a narrow line and a simple base keep the
      design legible; on longer nails, several colors or a second outline can
      be easier to distinguish. These are visual options, not rules: the
      gallery includes examples that mix curves, colors, and shapes. When
      saving a reference, note the actual outline and not just the shape label
      so the requested design can be discussed precisely.
  - heading: Turn a reference into a clear request
    body: >-
      Before an appointment, choose one image that shows the overall look and
      identify two or three details that matter most. You might specify a
      sheer pink base, a thin white edge, and a soft curve, or ask for a nude
      base with a bright blue tip and a straighter line. If you prefer a
      micro French design, say how fine you want the line and whether it
      should follow the nail edge. Mention any accent nails separately, such
      as glitter, dots, or a second color, rather than assuming they are part
      of every nail. For a shape change, show a second reference that
      illustrates the silhouette you want. This keeps the conversation
      focused on the finish and outline instead of relying on a broad style
      name. Use the designs here as visual prompts, then adapt the details to
      the length and shape you plan to wear.
