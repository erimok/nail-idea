intro: "Red appears as a full nail color, a French tip, and an accent within mixed designs. Check the image for where the red sits and which base or neighboring shades define its contrast; some references include extra motifs, so compare the central color idea separately from dots, cat-eye effects, or other decorative elements."
metaDescription: Browse 15 red nail designs, from solid color and French tips to mixed shades and accents.
sections:
  - heading: Red can be the whole look or a detail
    body: >-
      Red nails are versatile: a solid manicure makes the shade the focus, while French tips and mixed colors use it more sparingly. This gallery includes all of those directions. Compare deeper and brighter reds, and notice how each base changes the contrast. A single accent can bring color into a neutral design; full coverage feels more direct. Choose the balance that fits your personal style and the setting.
  - heading: Find a flattering shade and shape
    body: >-
      Red comes in different undertones, so compare the shade beside your skin rather than relying on a color name alone. Short nails can look crisp with a solid coat or slim tip; longer shapes give red French details more room. Consider your preferred finish and length, and choose natural nails or extensions based on comfort. If you want to keep the manicure wearable across occasions, pair red with a familiar neutral.
  - heading: Save a red manicure reference
    body: >-
      Look at how red appears across the entire set: as a full base, a French line, or an accent among other colors. Note the shape and finish too, since they change the overall effect. Save a full-hand design that shows the exact placement you like, then tell your nail tech which parts matter most. Browse these red nail ideas for a manicure that puts your favorite shade to work.
