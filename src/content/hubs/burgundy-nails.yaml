intro: "Burgundy appears in both solid-color ideas and French details across this collection. Notice whether the shade covers the whole nail, follows the tip, or is paired with a lighter base; the gallery also varies in shape and length, making it easier to compare the silhouette separately from the color placement."
metaDescription: Browse 8 burgundy nail designs, including solid shades and French details on different shapes.
sections:
  - heading: A rich shade with room to vary
    body: >-
      Burgundy nails bring depth without requiring extra decoration. The gallery pairs solid shades with French details across different shapes, so compare full-color coverage with burgundy used only at the tips. A glossy finish can make the shade look more saturated, while a matte surface gives a quieter impression. Check the surrounding base color too: nude and pink pairings shift the contrast and make the same burgundy feel more or less bold.
  - heading: Choose a shape and level of contrast
    body: >-
      On short nails, a burgundy tip or a neat solid coat keeps the color controlled; longer nails make a French outline more visible. Consider how the shade works with your skin undertone and the colors you wear most, then use a photo as a reference rather than a precise color promise. If you like natural nails, choose a length that supports your routine; extensions are another option, not a requirement.
  - heading: Save a burgundy look to take along
    body: >-
      Before choosing, note whether you prefer a full burgundy manicure, a contrasting base, or just a narrow edge. Look at the shape and finish in the complete set so your request covers more than color alone. Save the image that feels closest and tell your nail tech which detail matters most. Browse these burgundy nail designs for a polished shade idea you can make your own.
